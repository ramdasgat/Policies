<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacy Policies - Ramdas</title>
<style>
  :root{--bg:#F4ECE0;--card:#FBF6EC;--ink:#2B2018;--soft:#6B5A45;--rule:#D9C7AD;--accent:#B9442F}
  @media (prefers-color-scheme:dark){
    :root{--bg:#191410;--card:#221B15;--ink:#EDE4D6;--soft:#B5A48E;--rule:#3B3024;--accent:#E0715A}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:40px 20px;background:var(--bg);color:var(--ink);
       font:16px/1.65 Georgia,"Times New Roman",serif}
  main{max-width:640px;margin:0 auto;background:var(--card);padding:44px 40px;
       border-radius:14px;border:1px solid var(--rule)}
  h1{font-size:1.9em;margin:0 0 .3em;line-height:1.2}
  p.lede{color:var(--soft);margin:0 0 2em}
  ul{list-style:none;padding:0;margin:0}
  li{border-top:1px solid var(--rule)}
  li a{display:block;padding:16px 4px;color:var(--accent);text-decoration:none;
       font-size:1.1em}
  li a:hover{text-decoration:underline}
  li a small{display:block;color:var(--soft);font-size:.74em;margin-top:3px}
  footer{max-width:640px;margin:22px auto 0;color:var(--soft);font-size:.85em;
         text-align:center}
  footer a{color:var(--soft)}
</style>
</head>
<body>
<main>
<h1>Privacy Policies</h1>
<p class="lede">The privacy policy for each app, at a permanent address.</p>

<ul>
  <li>
    <a href="pagenova/">PageNova
      <small>com.ramdas.pagenova &middot; PDF reader</small>
    </a>
  </li>
</ul>
</main>
<footer>Questions about any of these: <a href="mailto:ramdasgat@gmail.com">ramdasgat@gmail.com</a></footer>
</body>
</html>
